services:
  mongo:
    image: mongo
    restart: always
    ports:
      - 3456:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: the_username
      MONGO_INITDB_ROOT_PASSWORD: the_password
      MONGO_INITDB_DATABASE: the_database
    volumes:
      - ./mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js
      - dev_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "echo", "'db.runCommand({ ping: 1 }).ok'", "|", "mongo"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis
    restart: always
    ports:
      - 6379:6379
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build: .
    ports:
      - 3000:3000
    command: ["npm", "run", "dev", "--", "-L"]
    environment:
      MONGO_URL: mongodb://the_username:${MONGODB_PASSWORD}@mongo:27017/the_database
      REDIS_URL: redis://redis:6379
    volumes:
      - ./:/usr/src/app:cached
      - /usr/src/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  dev_mongo_data:
  dev_redis_data: